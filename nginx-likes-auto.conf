server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name likes-auto.com www.likes-auto.com 47918326.cloudvps.in.th 103.91.205.39;
    client_max_body_size 20m;
    root /var/www/likes-auto;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/manifest+json image/svg+xml;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options nosniff always;

    if ($host = www.likes-auto.com) {
        return 301 https://likes-auto.com$request_uri;
    }

    location = /robots.txt { proxy_pass http://127.0.0.1:8000; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8000; }
    location = /manifest.webmanifest { proxy_pass http://127.0.0.1:8000; }

    location /css/ {
        alias /var/www/likes-auto/static/css/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Vary Accept-Encoding;
    }
    location /assets/ {
        alias /var/www/likes-auto/static/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Vary Accept-Encoding;
    }
    location /static/ {
        alias /var/www/likes-auto/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Vary Accept-Encoding;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 60s;
    }
}
