<div class="la-pack-switch pk-theme-strip {{ extra_class|default('') }}" role="group" aria-label="เลือกธีม">
  <span class="pk-theme-icon" title="เลือกธีมการแสดงผล"><i class="ri-palette-line"></i></span>
  <button type="button" class="pk-swatch-btn" data-pack="peak" onclick="laSetPack('peak')" title="Peakerr Lime" aria-label="Peakerr Lime" aria-pressed="false" style="background: linear-gradient(135deg, #051408 0%, #4da813 60%, #8ee31f 100%); --sw2: #8ee31f;"></button>
  <button type="button" class="pk-swatch-btn" data-pack="violet" onclick="laSetPack('violet')" title="Night Violet" aria-label="Night Violet" aria-pressed="false" style="background: linear-gradient(135deg, #120822 0%, #7c25d8 60%, #b862f8 100%); --sw2: #a855f7;"></button>
  <button type="button" class="pk-swatch-btn" data-pack="navy" onclick="laSetPack('navy')" title="Midnight Navy" aria-label="Midnight Navy" aria-pressed="false" style="background: linear-gradient(135deg, #071329 0%, #1d5ec9 60%, #3b82f6 100%); --sw2: #3b82f6;"></button>
  <button type="button" class="pk-swatch-btn" data-pack="light" onclick="laSetPack('light')" title="Peakerr Soft (Light)" aria-label="Peakerr Soft (Light)" aria-pressed="false" style="background: linear-gradient(135deg, #ffffff 0%, #86efac 55%, #38a11b 100%); --sw2: #5eb516;"></button>
</div>
