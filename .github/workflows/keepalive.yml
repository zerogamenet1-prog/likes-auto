name: Keep Render awake & Auto-Run Crons
on:
  schedule:
    # every 5 minutes (standard GitHub Actions minimum)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend and trigger automated background crons
        run: |
          curl -fsS --max-time 45 "https://likes-auto.com/ping.php" || true
          curl -fsS --max-time 45 "https://likes-auto.onrender.com/health" || true
          curl -fsS --max-time 45 "https://likes-auto.onrender.com/api/cron?key=likesauto2026" || true
          curl -fsS --max-time 45 "https://likes-auto.onrender.com/internal/cron?key=likesauto2026" || true
