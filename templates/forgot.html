{% extends "base.html" %}
{% block content %}
<main class="la-page">
  <div class="la-wrap">
    <div class="la-form-shell">
      <div class="la-form-copy">
        <h2>ลืมรหัสผ่าน</h2>
        <p>กรอกอีเมลบัญชี ระบบจะส่งลิงก์ตั้งรหัสใหม่ถ้าเปิด SMTP ไว้</p>
      </div>
      <div class="la-form-side">
        {% if error %}<div class="adm-error">{{ error }}</div>{% endif %}
        {% if ok %}<div class="adm-ok">{{ ok }}</div>{% endif %}
        <form method="post" action="/forgot">
          <label class="la-field">อีเมล</label>
          <input class="la-input" type="email" name="email" required>
          <button class="la-btn" type="submit" style="width:100%">ส่งลิงก์รีเซ็ต</button>
        </form>
        <p style="margin-top:14px"><a href="/signin">กลับเข้าสู่ระบบ</a></p>
      </div>
    </div>
  </div>
</main>
{% endblock %}
