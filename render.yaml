# Deploy on Render.com: Web Service + persistent disk for SQLite (data/app.db).
services:
  - type: web
    name: likes-auto
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Persistent disk requires a paid Render plan. On Free, avoid frequent redeploys
    # (SQLite in data/ resets when the instance is rebuilt).
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: ALLOW_DEMO_SEED
        value: "1"
      - key: DEMO_CLIENT_USER
        value: demo
      - key: DEMO_CLIENT_PASS
        value: Demo1234!
