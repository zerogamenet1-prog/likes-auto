name: Keep Render awake
on:
  schedule:
    # every 12 minutes
    - cron: "*/12 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm backend via site bridge
        run: |
          curl -fsS --max-time 60 "https://likes-auto.com/ping.php" || true
          curl -fsS --max-time 60 "https://likes-auto.onrender.com/health"
