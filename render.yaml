# Deploy on Render.com: Web Service + persistent disk for SQLite (data/app.db).
services:
  - type: web
    name: likes-auto
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    disk:
      name: likes-auto-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: ALLOW_DEMO_SEED
        value: "1"
      - key: DEMO_CLIENT_USER
        value: demo
      - key: DEMO_CLIENT_PASS
        value: Demo1234!
