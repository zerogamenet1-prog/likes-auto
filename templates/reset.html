{% extends "base.html" %}
{% block content %}
<main class="la-page">
  <div class="la-wrap">
    <div class="la-form-shell">
      <div class="la-form-copy">
        <h2>ตั้งรหัสผ่านใหม่</h2>
        <p>รหัสอย่างน้อย 6 ตัว</p>
      </div>
      <div class="la-form-side">
        {% if error %}<div class="adm-error">{{ error }}</div>{% endif %}
        <form method="post" action="/reset">
          <input type="hidden" name="token" value="{{ token }}">
          <label class="la-field">รหัสผ่านใหม่</label>
          <input class="la-input" type="password" name="password" required minlength="6">
          <label class="la-field">ยืนยันรหัสผ่าน</label>
          <input class="la-input" type="password" name="confirm" required minlength="6">
          <button class="la-btn" type="submit" style="width:100%">บันทึกรหัสใหม่</button>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}
