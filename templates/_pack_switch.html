<div class="la-pack-switch pk-theme-strip {{ extra_class|default('') }}" role="group" aria-label="เลือกธีม">
  <span class="pk-theme-icon" title="เลือกธีมการแสดงผล"><i class="ri-palette-line"></i></span>
  <button type="button" class="pk-swatch-btn" data-pack="peak" onclick="laSetPack('peak')" title="Peakerr Lime" aria-label="Peakerr Lime" aria-pressed="false" style="--sw:#020804;--sw2:#8ee31f;"></button>
  <button type="button" class="pk-swatch-btn" data-pack="violet" onclick="laSetPack('violet')" title="Night Violet" aria-label="Night Violet" aria-pressed="false" style="--sw:#080614;--sw2:#a855f7;"></button>
  <button type="button" class="pk-swatch-btn" data-pack="navy" onclick="laSetPack('navy')" title="Midnight Navy" aria-label="Midnight Navy" aria-pressed="false" style="--sw:#0b1020;--sw2:#3b82f6;"></button>
  <button type="button" class="pk-swatch-btn" data-pack="light" onclick="laSetPack('light')" title="Peakerr Soft (Light)" aria-label="Peakerr Soft (Light)" aria-pressed="false" style="--sw:#f4f7f2;--sw2:#5eb516;"></button>
</div>
