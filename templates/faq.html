{% extends "base.html" %}
{% block content %}
<main class="la-page">
  <div class="la-wrap">
    <div class="la-page-head">
      <div class="la-kicker">FAQ</div>
      <h1>{{ t.faq_title }}</h1>
      <p class="sub">{{ t.faq_sub }}</p>
    </div>
    <div class="la-faq">
      {% for item in faq %}
      <details{% if loop.first %} open{% endif %}><summary>{{ item.q }}</summary><p>{{ item.a }}</p></details>
      {% endfor %}
    </div>
  </div>
</main>
{% endblock %}
