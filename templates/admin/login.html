<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>เข้าสู่ระบบแอดมิน | LIKES AUTO</title>
  <link rel="icon" href="/static/assets/admin-crest.png">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/panel/ideacode/admin.css?v=dash11">
  <script>
    (function(){ try { var t=localStorage.getItem('la-dash-theme'); if(t) document.documentElement.setAttribute('data-theme', t); } catch(e){} })();
  </script>
</head>
<body class="dash-body">
  <div class="auth-wrap">
    <section class="auth-hero">
      <div class="auth-crest"><img src="/static/assets/admin-crest.png" alt="LIKES AUTO"></div>
      <p class="auth-kicker">LIKES AUTO ADMIN</p>
      <h2>แผงควบคุมร้าน SMM</h2>
      <p>จัดการออเดอร์ ลูกค้า เติมเงิน บริการจาก API และตั้งค่าร้านในที่เดียว</p>
    </section>
    <section class="auth-form">
      <div class="auth-card">
        <h1 style="margin:0 0 6px;font-size:24px">เข้าสู่ระบบ</h1>
        <p class="la-muted" style="margin:0 0 18px">ใช้บัญชีแอดมินเพื่อเปิดแดชบอร์ด</p>
        {% if error %}<div class="adm-error">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login">
          <label class="la-field">ชื่อผู้ใช้</label>
          <input class="la-input" type="text" name="username" required autocomplete="username">
          <label class="la-field">รหัสผ่าน</label>
          <input class="la-input" type="password" name="password" required autocomplete="current-password">
          <button class="la-btn" type="submit" style="width:100%;margin-top:8px">เข้าสู่ระบบ</button>
        </form>
      </div>
    </section>
  </div>
</body>
</html>
